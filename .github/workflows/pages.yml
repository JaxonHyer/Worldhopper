# Deploy to GitHub Pages with the official Pages actions (AGENT_PROMPT.md §3).
# Build output is never committed: `dist/` is generated here and uploaded as an
# artifact. Runs only from the default branch.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build + verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Node 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install (exact, from lockfile)
        run: npm ci

      - name: Logic tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Pages-constraint checks on dist
        run: npm run test:dist

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
