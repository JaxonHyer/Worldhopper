# CI is the reviewer (AGENT_PROMPT.md §10): a pull request only merges when
# this suite is green. Everything here is headless and needs no secrets.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: unit + build + headless smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Node 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install (exact, from lockfile)
        run: npm ci

      - name: Logic tests (headless, no browser)
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Pages-constraint checks on dist
        run: npm run test:dist

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Headless smoke test (built game, screenshots, window.__debug assertions)
        run: npm run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots
          path: artifacts/screenshots
          if-no-files-found: warn

      - name: Upload built site
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: warn

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: artifacts/playwright-report
          if-no-files-found: ignore
